server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Имя контейнера → метка container
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Сервис из docker-compose → метка service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Поток (stdout/stderr) → метка logstream
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
    pipeline_stages:
      # Парсим JSON-логи нашего сервиса
      - json:
          expressions:
            level: level
            logger: logger
            msg: message
            http_method: http_method
            http_path: http_path
            http_status: http_status
      # Продвигаем поля как метки для фильтрации в Loki/Grafana
      - labels:
          level:
          http_path:
